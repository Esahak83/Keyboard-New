name: Build Ridmik Studio Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP and locate Gradle project
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting ZIP: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -x ".github/*"
          fi
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            SUB_SETTINGS=$(find . -maxdepth 3 -name "settings.gradle.kts" | head -n 1)
            if [ -n "$SUB_SETTINGS" ]; then
              PROJ_DIR=$(dirname "$SUB_SETTINGS")
              echo "Moving project files from $PROJ_DIR to root..."
              cp -rn "$PROJ_DIR"/* . || true
            else
              echo "::error::Ridmik-Studio-Keyboard-Android.zip পাওয়া যায়নি! আগে আপনার GitHub রিপোজিটরির Code ট্যাবে গিয়ে ZIP ফাইলটি Upload করুন।"
              ls -la
              exit 1
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Ridmik Studio APK
        uses: actions/upload-artifact@v4
        with:
          name: Ridmik-Studio-Keyboard-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
